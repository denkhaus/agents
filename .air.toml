# Air configuration for CogniBase hot reload development
root = "."
testdata_dir = "testdata"
tmp_dir = "/tmp"

[build]
args_bin = ["server"]
bin = "/tmp/main"
cmd = "go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/main ./system"
delay = 500
exclude_dir = [
  ".qoder",
  "legacy",
  "examples",
  "screenshot",
  "scripts",
  ".git",
  ".github",
  "test_workspace",
]
exclude_file = []
exclude_regex = ["_test.go", "_mock.go", ".*_gen.go"]
exclude_unchanged = true
follow_symlink = false
full_bin = ""
include_dir = ["cmd", "internal"]
include_ext = ["go"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
rerun = false
rerun_delay = 200
send_interrupt = true
stop_on_root = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
