# Air configuration for CogniBase hot reload development
root = "."
testdata_dir = "testdata"
tmp_dir = "/tmp"

[build]
args_bin = ["server"]
bin = "/tmp/main"
cmd = "go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/main ./system"
delay = 1000
exclude_dir = [
  ".qoder",
  "legacy",
  "examples",
  "screenshots",
  "scripts",
  ".git",
  ".github",
  "test_workspace",
  "docker",
  "node_modules",
  "vendor",
  "tmp",
]
exclude_file = []
exclude_regex = ["_test.go", "_mock.go", ".*_gen.go"]
exclude_unchanged = true
follow_symlink = false
full_bin = ""
include_dir = [
  "system",
  "pkg",
  "cmd",
  "internal",
  "config",
  "di",
  "logger",
  "magefiles",
]
include_ext = ["go"]
include_file = []
kill_delay = "5s"
log = "build-errors.log"
poll = true
poll_interval = 500
rerun = true
rerun_delay = 500
send_interrupt = false
stop_on_root = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = true
keep_scroll = true
