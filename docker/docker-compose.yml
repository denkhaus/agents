services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - agents-network
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "6888:5432" # Use different port to avoid conflicts

  ###########################################################################################
  # New React Chat Client
  react-chat:
    build:
      context: .
      dockerfile: Dockerfile.react-chat
    restart: unless-stopped
    networks:
      - agents-network
    env_file: ../.env
    ports:
      - "3000:3000"
    volumes:
      - ./react-chat:/app
      - /app/node_modules
    depends_on:
      - agents
    # Add health check to ensure the service is ready
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ###########################################################################################
  agents:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agents
    env_file: ../.env
    restart: unless-stopped
    ports:
      - "9451:8080"
      - "6999:6999"
      - "2345:2345" # Delve debugger port
    volumes:
      # Mount entire backend directory for hot-reloading with air
      - ../:/app/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/tmp/go-build-cache
    working_dir: /app/src
    command: ["air", "-c", "/app/src/.air.toml"]
    networks:
      - agents-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:

networks:
  agents-network:
    driver: bridge
