services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - agents-network
    env_file: ../.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "6888:5432" # Use different port to avoid conflicts
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agents} -d ${POSTGRES_DB:-agents}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ###########################################################################################
  agents:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agents
    env_file: ../.env.docker
    restart: unless-stopped
    ports:
      - "9451:8080"
      - "6999:6999"
      - "2345:2345" # Delve debugger port
    volumes:
      # Mount entire backend directory for hot-reloading with air
      - ../:/app/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/tmp/go-build-cache
    working_dir: /app/src
    command: ["air", "-c", "/app/src/.air.toml"]
    networks:
      - agents-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  ##################################################################################
  backend:
    # Change this to :${REV} if you want to pin to a specific version
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    env_file: ../.env.docker
    restart: unless-stopped
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - convex_data:/convex/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agents-network
    environment:
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - CONVEX_RELEASE_VERSION_DEV
      - ACTIONS_USER_TIMEOUT_SECS
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - DATABASE_URL
      - DISABLE_BEACON
      - REDACT_LOGS_TO_CLIENT
      - DO_NOT_REQUIRE_SSL=true
      - POSTGRES_URL=postgres://agents:agents@postgres:5432?sslmode=disable
      - MYSQL_URL
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_S3_FORCE_PATH_STYLE
      - AWS_S3_DISABLE_SSE
      - AWS_S3_DISABLE_CHECKSUMS
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_ENDPOINT_URL

    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    # Change this to :${REV} if you want to pin to a specific version
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
    networks:
      - agents-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  convex_data:

networks:
  agents-network:
    driver: bridge
