services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AGENTS_DB_USER:-agents}
      POSTGRES_PASSWORD: ${AGENTS_DB_PASSWORD:-agents}
      POSTGRES_DB: ${AGENTS_DB_NAME:-agents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "6888:5432" # Use different port to avoid conflicts

  adk-web:
    build:
      context: .
      dockerfile: Dockerfile.adk-web
    restart: unless-stopped
    environment:
      BACKEND_URL: ${ADK_BACKEND_URL:-http://host.docker.internal:6999}
    ports:
      - "4200:4200"
    depends_on:
      - postgres
    # Add health check to ensure the service is ready
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
