# Override file for development-specific configurations
# This file is automatically loaded by docker-compose and can be used
# to override settings in docker-compose.yml for local development

services:
  adk-web:
    # Mount source code for development (optional)
    # volumes:
    #   - ./adk-web-src:/app
    
    # Enable development mode
    environment:
      - NODE_ENV=development
      
    # Add labels for easier management
    labels:
      - "traefik.enable=false"
      - "com.agents.service=adk-web"
      - "com.agents.description=ADK Web Frontend"

  postgres:
    # Add labels for easier management
    labels:
      - "com.agents.service=database"
      - "com.agents.description=PostgreSQL Database"
    
    # Optional: expose additional ports for debugging
    # ports:
    #   - "6888:5432"