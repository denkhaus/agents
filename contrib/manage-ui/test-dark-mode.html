<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Test</title>
    <style>
        :root {
            --background: oklch(1 0 0);
            --foreground: oklch(0.141 0.005 285.823);
            --card: oklch(1 0 0);
            --border: oklch(0.92 0.004 286.32);
        }

        .dark {
            --background: oklch(0.141 0.005 285.823);
            --foreground: oklch(0.985 0 0);
            --card: oklch(0.21 0.006 285.885);
            --border: oklch(1 0 0 / 10%);
        }

        body {
            background: var(--background);
            color: var(--foreground);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        button {
            background: var(--card);
            color: var(--foreground);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Dark Mode Test</h1>
    <div class="card">
        <h2>Test Card</h2>
        <p>This should change colors when dark mode is toggled.</p>
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>

    <div id="status"></div>

    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            
            if (isDark) {
                html.classList.remove('dark');
                document.getElementById('status').textContent = 'Light mode active';
            } else {
                html.classList.add('dark');
                document.getElementById('status').textContent = 'Dark mode active';
            }
            
            console.log('Dark class present:', html.classList.contains('dark'));
            console.log('HTML classes:', html.className);
        }

        // Initialize
        document.getElementById('status').textContent = 'Light mode active';
    </script>
</body>
</html>
